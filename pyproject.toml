[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-mcp"
version = "0.1.0"
description = "MCP server for per-user long-term memory backed by SQLite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dolphin2702" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
memory-mcp = "memory_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_mcp"]
